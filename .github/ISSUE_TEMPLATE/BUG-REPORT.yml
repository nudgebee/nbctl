name: "🐛 Bug Report"
description: Report a bug in nbctl.
title: "🐛 [BUG] - <title>"
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: A clear and concise description of the bug.
      placeholder: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reprod
    attributes:
      label: "Reproduction steps"
      description: Exact commands and inputs that reproduce the bug.
      value: |
        1. Run `nbctl ...`
        2. Observe error / unexpected output
      render: bash
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual output"
      description: The output you saw. Include the full error message and stack trace if any.
      render: bash
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected output"
      description: What you expected to see.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: "nbctl version"
      description: "Output of `nbctl version`."
      placeholder: e.g. nbctl version 0.1.0
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: "Install method"
      description: How did you install nbctl?
      multiple: false
      options:
        - Released binary (GitHub release)
        - go install
        - Built from source
        - Other (please mention in description)
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: "OS"
      description: Operating system where the bug occurred.
      multiple: false
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true

  - type: dropdown
    id: arch
    attributes:
      label: "Architecture"
      multiple: false
      options:
        - amd64
        - arm64
        - other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Verbose logs"
      description: |
        Re-run the failing command with `--verbose` and paste the
        relevant section of `nbctl_graphql.log`. Redact any
        sensitive values (account IDs, tokens, hostnames).
      render: bash
    validations:
      required: false
