name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
      - name: Install deps
        run: go mod download
      - name: Run fmt
        run: make fmt
      - name: Run lint
        run: make lint
      - name: Run tests
        run: make test
