name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4.0
          working-directory: ./
          only-new-issues: true
          args: --timeout 20m 
      - name: Get version from tag
        id: get_version
        run: echo "${GITHUB_REF#refs/tags/}" > VERSION
      - name: Install deps
        run: go mod download
      - name: Run tests
        run: make test
      - name: Build
        run: |
          mkdir -p dist
          EXT=""
          if [ "${{ matrix.os }}" = "windows" ]; then
            EXT=".exe"
          fi
          BIN=nbctl-${{ matrix.os }}-${{ matrix.arch }}${EXT}
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} BIN=$BIN make build-artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nbctl-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/nbctl-${{ matrix.os }}-${{ matrix.arch }}*

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*/*
