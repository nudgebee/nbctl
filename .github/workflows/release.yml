name: Release

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
      - name: Get version from tag
        id: get_version
        run: echo "${GITHUB_REF#refs/tags/}" > VERSION
      - name: Install deps
        run: go mod download
      - name: Build
        run: |
          mkdir -p dist
          BIN=nbctl-${{ matrix.os }}-${{ matrix.arch }}
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} make build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nbctl-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/nbctl-${{ matrix.os }}-${{ matrix.arch }}

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*/*
